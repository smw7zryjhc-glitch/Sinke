<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scratch Adventure - النسخة التنافسية الشاملة</title>
    <style>
        :root {
            /* الثيم الافتراضي: ليل النيون */
            --bg-main: #090a0f;
            --bg-gradient-1: rgba(255, 51, 102, 0.18);
            --bg-gradient-2: rgba(79, 172, 254, 0.18);
            --panel-bg: rgba(22, 24, 38, 0.82);
            --cell-bg: rgba(255, 255, 255, 0.04);
            --cell-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #ff3366;
            --accent-secondary: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --ladder-bg: rgba(16, 185, 129, 0.15);
            --ladder-border: #10b981;
            --snake-bg: rgba(239, 68, 68, 0.15);
            --snake-border: #ef4444;
        }

        /* ثيم الشتاء الدافئ */
        [data-theme="winter"] {
            --bg-main: #0f172a;
            --bg-gradient-1: rgba(56, 189, 248, 0.22);
            --bg-gradient-2: rgba(224, 242, 254, 0.15);
            --panel-bg: rgba(30, 41, 59, 0.85);
            --cell-bg: rgba(241, 245, 249, 0.06);
            --cell-border: rgba(186, 230, 253, 0.15);
            --accent-primary: #38bdf8;
            --accent-secondary: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --ladder-bg: rgba(52, 211, 153, 0.18);
            --ladder-border: #34d399;
            --snake-bg: rgba(251, 113, 133, 0.18);
            --snake-border: #fb7185;
        }

        /* ثيم الغرفة الدافئة (الكلاسيكي) */
        [data-theme="cozy"] {
            --bg-main: #1c1917;
            --bg-gradient-1: rgba(217, 119, 6, 0.18);
            --bg-gradient-2: rgba(180, 83, 9, 0.15);
            --panel-bg: rgba(41, 37, 36, 0.88);
            --cell-bg: rgba(254, 243, 199, 0.05);
            --cell-border: rgba(253, 230, 138, 0.12);
            --accent-primary: #f59e0b;
            --accent-secondary: #10b981;
            --text-main: #fef3c7;
            --text-muted: #d6d3d1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, var(--bg-gradient-1) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--bg-gradient-2) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: background-color 0.4s ease;
        }

        .game-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--cell-border);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* شريط الأدوات العلوي والثيمات */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
        }

        .theme-switcher {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 12px;
        }

        .theme-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: none;
        }

        .theme-btn.active {
            background: var(--accent-primary);
            color: #fff;
            font-weight: bold;
        }

        .sound-btn {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--cell-border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: none;
            padding: 0;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-primary);
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* بطاقات اللاعبين والقدرات */
        .players-hud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid var(--cell-border);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
            opacity: 0.65;
        }

        .player-card.active-turn {
            opacity: 1;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
            transform: translateY(-2px);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .player-badges {
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .badge-item.used {
            opacity: 0.3;
            text-decoration: line-through;
        }

        /* لوحة اللعب (30 خانة) */
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 18px;
            margin-bottom: 14px;
            border: 1px solid var(--cell-border);
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid var(--cell-border);
            transition: transform 0.2s, background 0.3s;
        }

        .cell.ladder {
            background: var(--ladder-bg);
            border-color: var(--ladder-border);
        }

        .cell.snake {
            background: var(--snake-bg);
            border-color: var(--snake-border);
        }

        .cell.bonus {
            background: rgba(245, 158, 11, 0.15);
            border-color: #f59e0b;
        }

        .cell.finish {
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.3), rgba(245, 158, 11, 0.3));
            border-color: var(--accent-primary);
        }

        .cell-number {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cell-icon {
            position: absolute;
            bottom: 3px;
            left: 5px;
            font-size: 0.75rem;
            opacity: 0.85;
        }

        /* الشخصيات */
        .token-container {
            display: flex;
            gap: 3px;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .player-token {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .token-fox {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: 2px solid #fff;
        }

        .token-panda {
            background: linear-gradient(135deg, #334155, #0f172a);
            border: 2px solid #38bdf8;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); }
            100% { transform: scale(1); }
        }

        /* لوحة التحكم والقدرات */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.28);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid var(--cell-border);
        }

        .powerups-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .power-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--cell-border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 10px;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: none;
        }

        .power-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }

        .power-btn.armed {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            font-weight: bold;
        }

        .power-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .main-roll-btn {
            background: linear-gradient(135deg, var(--accent-primary), #e11d48);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.35);
            transition: transform 0.15s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .main-roll-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .main-roll-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* نافذة الفوز (Modal) */
        .victory-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 15, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.4s ease;
        }

        .victory-overlay.show {
            display: flex;
        }

        .victory-icon {
            font-size: 4rem;
            margin-bottom: 12px;
            animation: bounce 1s infinite alternate;
        }

        .victory-title {
            font-size: 1.8rem;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .victory-sub {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- الشريط العلوي لتغيير البيئة والصوت -->
    <div class="top-bar">
        <div class="theme-switcher">
            <button class="theme-btn active" onclick="setTheme('neon', this)">ليل النيون</button>
            <button class="theme-btn" onclick="setTheme('winter', this)">الشتاء</button>
            <button class="theme-btn" onclick="setTheme('cozy', this)">الغرفة</button>
        </div>
        <button class="sound-btn" id="soundToggle" onclick="toggleSound()" title="كتم/تشغيل الصوت">🔊</button>
    </div>

    <header>
        <h1>Scratch Adventure</h1>
    </header>

    <!-- بطاقات حالة اللاعبين -->
    <div class="players-hud">
        <div class="player-card active-turn" id="card-0">
            <div class="player-header">
                <span>🦊 الثعلب</span>
                <span id="pos-0">خانة 1</span>
            </div>
            <div class="player-badges">
                <span class="badge-item" id="shield-badge-0">🛡️ درع</span>
                <span class="badge-item" id="double-badge-0">⚡ مضاعف</span>
            </div>
        </div>
        <div class="player-card" id="card-1">
            <div class="player-header">
                <span>🐼 البندا</span>
                <span id="pos-1">خانة 1</span>
            </div>
            <div class="player-badges">
                <span class="badge-item" id="shield-badge-1">🛡️ درع</span>
                <span class="badge-item" id="double-badge-1">⚡ مضاعف</span>
            </div>
        </div>
    </div>

    <!-- مضمار اللعب (30 خانة) -->
    <div class="board" id="board"></div>

    <!-- لوحة التحكم -->
    <div class="control-panel">
        <div class="status-box" id="gameStatus">دور 🦊 الثعلب: اختر قدرة تكتيكية أو ارمِ النرد!</div>
        
        <div class="powerups-bar">
            <button class="power-btn" id="btnShield" onclick="armPowerup('shield')">🛡️ تفعيل درع الحماية</button>
            <button class="power-btn" id="btnDouble" onclick="armPowerup('double')">⚡ تفعيل النرد المضاعف</button>
        </div>

        <button class="main-roll-btn" id="rollBtn" onclick="playTurn()">
            <span>رمي النرد</span>
            <span id="diceVisual">🎲</span>
        </button>
    </div>

    <!-- شاشة الفوز الاحتفالية -->
    <div class="victory-overlay" id="victoryModal">
        <div class="victory-icon" id="winnerIcon">🏆</div>
        <h2 class="victory-title" id="winnerTitle">انتصار مستحق!</h2>
        <p class="victory-sub" id="winnerDesc">لقد وصل الثعلب إلى خط النهاية أولاً.</p>
        <button class="main-roll-btn" style="width: 100%;" onclick="resetGame()">لعب جولة جديدة 🔄</button>
    </div>
</div>

<script>
    // نظام الصوت المدمج (Web Audio API) بدون ملفات خارجية
    const AudioEngine = {
        ctx: null,
        muted: false,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        },
        playTone(freq, type, duration, vol = 0.15) {
            if (this.muted) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        step() { this.playTone(420, 'sine', 0.08, 0.1); },
        dice() { this.playTone(600, 'triangle', 0.12, 0.15); },
        ladder() {
            this.playTone(400, 'sine', 0.15);
            setTimeout(() => this.playTone(600, 'sine', 0.15), 100);
            setTimeout(() => this.playTone(850, 'sine', 0.25), 200);
        },
        snake() {
            this.playTone(350, 'sawtooth', 0.2);
            setTimeout(() => this.playTone(220, 'sawtooth', 0.3), 150);
        },
        win() {
            [523, 659, 784, 1046].forEach((f, idx) => {
                setTimeout(() => this.playTone(f, 'triangle', 0.3, 0.2), idx * 120);
            });
        }
    };

    function toggleSound() {
        AudioEngine.muted = !AudioEngine.muted;
        document.getElementById('soundToggle').innerText = AudioEngine.muted ? '🔇' : '🔊';
    }

    // تغيير الثيمات
    function setTheme(themeName, btnElement) {
        if (themeName === 'neon') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', themeName);
        }
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        AudioEngine.step();
    }

    // إعدادات المضمار (30 خانة)
    const TOTAL_CELLS = 30;
    const SPECIAL_TILES = {
        4:  { type: 'ladder', target: 12, icon: '🪜', msg: '🚀 سلم سريع! صعدت إلى الخانة 12!' },
        8:  { type: 'bonus',  target: 8,  icon: '🎁', msg: '🎁 صندوق حظ! حصلت على رمية إضافية!' },
        11: { type: 'snake',  target: 5,  icon: '🐍', msg: '🐍 أفعى ماكرة! تراجعت إلى الخانة 5!' },
        15: { type: 'ladder', target: 23, icon: '🪜', msg: '🚀 قفزة عملاقة عبر السلم إلى الخانة 23!' },
        19: { type: 'snake',  target: 10, icon: '🐍', msg: '🐍 زلقت مع الأفعى إلى الخانة 10!' },
        22: { type: 'bonus',  target: 22, icon: '🎁', msg: '🎁 مكافأة التحدي! دور إضافي لك!' },
        27: { type: 'snake',  target: 18, icon: '🐍', msg: '🐍 أوه! أفعى قبل النهاية أعادتك للخانة 18!' }
    };

    let state = {};

    function initState() {
        state = {
            players: [
                { id: 0, name: 'الثعلب', icon: '🦊', class: 'token-fox', pos: 1, hasShield: true, hasDouble: true, shieldArmed: false, doubleArmed: false },
                { id: 1, name: 'البندا', icon: '🐼', class: 'token-panda', pos: 1, hasShield: true, hasDouble: true, shieldArmed: false, doubleArmed: false }
            ],
            turn: 0,
            locked: false
        };
    }

    function buildBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 1; i <= TOTAL_CELLS; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${i}`;

            if (i === TOTAL_CELLS) {
                cell.classList.add('finish');
            } else if (SPECIAL_TILES[i]) {
                cell.classList.add(SPECIAL_TILES[i].type);
            }

            const num = document.createElement('span');
            num.className = 'cell-number';
            num.innerText = i;
            cell.appendChild(num);

            if (i === TOTAL_CELLS) {
                const icon = document.createElement('span');
                icon.className = 'cell-icon';
                icon.innerText = '🏁';
                cell.appendChild(icon);
            } else if (SPECIAL_TILES[i]) {
                const icon = document.createElement('span');
                icon.className = 'cell-icon';
                icon.innerText = SPECIAL_TILES[i].icon;
                cell.appendChild(icon);
            }

            const tokens = document.createElement('div');
            tokens.className = 'token-container';
            tokens.id = `tokens-${i}`;
            cell.appendChild(tokens);

            board.appendChild(cell);
        }
    }

    function updateUI() {
        // تحديث الشخصيات
        for (let i = 1; i <= TOTAL_CELLS; i++) {
            document.getElementById(`tokens-${i}`).innerHTML = '';
        }

        state.players.forEach(p => {
            const container = document.getElementById(`tokens-${p.pos}`);
            if (container) {
                const el = document.createElement('div');
                el.className = `player-token ${p.class}`;
                el.innerText = p.icon;
                container.appendChild(el);
            }

            // تحديث البطاقات العلوية
            document.getElementById(`pos-${p.id}`).innerText = `خانة ${p.pos}`;
            document.getElementById(`card-${p.id}`).classList.toggle('active-turn', state.turn === p.id);
            document.getElementById(`shield-badge-${p.id}`).classList.toggle('used', !p.hasShield);
            document.getElementById(`double-badge-${p.id}`).classList.toggle('used', !p.hasDouble);
        });

        // تحديث أزرار القدرات للاعب الحالي
        const curr = state.players[state.turn];
        const btnShield = document.getElementById('btnShield');
        const btnDouble = document.getElementById('btnDouble');

        btnShield.disabled = !curr.hasShield || state.locked;
        btnDouble.disabled = !curr.hasDouble || state.locked;

        btnShield.classList.toggle('armed', curr.shieldArmed);
        btnDouble.classList.toggle('armed', curr.doubleArmed);
    }

    function armPowerup(type) {
        if (state.locked) return;
        const curr = state.players[state.turn];
        AudioEngine.step();

        if (type === 'shield' && curr.hasShield) {
            curr.shieldArmed = !curr.shieldArmed;
            setStatus(curr.shieldArmed ? `🛡️ تم تجهيز درع الحماية لـ ${curr.name}!` : `تم إلغاء تجهيز الدرع.`);
        } else if (type === 'double' && curr.hasDouble) {
            curr.doubleArmed = !curr.doubleArmed;
            setStatus(curr.doubleArmed ? `⚡ تم تفعيل النرد المضاعف لـ ${curr.name}!` : `تم إلغاء النرد المضاعف.`);
        }
        updateUI();
    }

    async function playTurn() {
        if (state.locked) return;
        state.locked = true;
        document.getElementById('rollBtn').disabled = true;
        updateUI();

        const curr = state.players[state.turn];
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        // تأثير دوران النرد البصري
        for (let i = 0; i < 6; i++) {
            AudioEngine.dice();
            document.getElementById('diceVisual').innerText = diceFaces[Math.floor(Math.random() * 6)];
            await sleep(70);
        }

        let roll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('diceVisual').innerText = diceFaces[roll - 1];

        if (curr.doubleArmed) {
            roll *= 2;
            curr.hasDouble = false;
            curr.doubleArmed = false;
            setStatus(`⚡ رمية مضاعفة! حصل ${curr.name} على ${roll} خطوات!`);
        } else {
            setStatus(`🎲 رمى ${curr.name} النرد وحصل على: ${roll}`);
        }

        await sleep(500);

        // تحريك الشخصية خطوة بخطوة
        const targetStep = Math.min(curr.pos + roll, TOTAL_CELLS);
        while (curr.pos < targetStep) {
            curr.pos++;
            AudioEngine.step();
            updateUI();
            await sleep(220);
        }

        let extraTurn = false;

        // فحص الخانات الخاصة
        const tile = SPECIAL_TILES[curr.pos];
        if (tile) {
            await sleep(300);
            if (tile.type === 'ladder') {
                AudioEngine.ladder();
                setStatus(tile.msg);
                curr.pos = tile.target;
                updateUI();
                await sleep(700);
            } else if (tile.type === 'snake') {
                if (curr.shieldArmed) {
                    AudioEngine.ladder();
                    curr.hasShield = false;
                    curr.shieldArmed = false;
                    setStatus(`🛡️ أنقذك درع الحماية من الأفعى!`);
                    updateUI();
                    await sleep(800);
                } else {
                    AudioEngine.snake();
                    setStatus(tile.msg);
                    curr.pos = tile.target;
                    updateUI();
                    await sleep(700);
                }
            } else if (tile.type === 'bonus') {
                AudioEngine.ladder();
                setStatus(tile.msg);
                extraTurn = true;
                await sleep(700);
            }
        }

        // فحص الفوز
        if (curr.pos === TOTAL_CELLS) {
            AudioEngine.win();
            document.getElementById('winnerIcon').innerText = curr.icon;
            document.getElementById('winnerTitle').innerText = `فاز ${curr.name} بالسباق!`;
            document.getElementById('winnerDesc').innerText = `أداء تنافسي رائع! وصل ${curr.name} إلى خط النهاية.`;
            document.getElementById('victoryModal').classList.add('show');
            return;
        }

        // تبديل الدور أو منح دور إضافي
        if (!extraTurn) {
            state.turn = 1 - state.turn;
        }

        const nextPlayer = state.players[state.turn];
        setStatus(`دور ${nextPlayer.icon} ${nextPlayer.name}: اضغط رمي النرد!`);
        state.locked = false;
        document.getElementById('rollBtn').disabled = false;
        updateUI();
    }

    function resetGame() {
        document.getElementById('victoryModal').classList.remove('show');
        document.getElementById('rollBtn').disabled = false;
        initState();
        updateUI();
        setStatus(`جولة جديدة! دور 🦊 الثعلب للبدء.`);
    }

    function setStatus(text) {
        document.getElementById('gameStatus').innerText = text;
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // التشغيل الأولي
    initState();
    buildBoard();
    updateUI();
</script>

</body>
</html>
